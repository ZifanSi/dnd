<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sword Coast Locations Map</title>
<style>
  :root {
    --panel-bg: rgba(22, 20, 18, 0.88);
    --panel-border: rgba(255, 255, 255, 0.10);
    --panel-fg: #f1ead9;
    --panel-fg-dim: #b9b0a0;
    --map-bg: #e2cd9c;
    --accent: #e8b84b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #14120f;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }

  #svgRoot {
    width: 100%; height: 100%;
    display: block;
    cursor: grab;
    background: var(--map-bg);
    touch-action: none;
  }
  #svgRoot.dragging { cursor: grabbing; }

  .loc-dot { stroke: #241f16; transition: opacity 0.12s linear; }

  .loc-label {
    fill: #241f16;
    paint-order: stroke;
    stroke: var(--map-bg);
    stroke-width: 0.32px;
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
    display: none;
    transition: opacity 0.12s linear;
  }
  .loc-label.type-city { display: block; font-weight: 700; }
  #app.show-town .loc-label.type-town { display: block; }
  #app.show-minor .loc-label.type-forest,
  #app.show-minor .loc-label.type-mountain,
  #app.show-minor .loc-label.type-river,
  #app.show-minor .loc-label.type-region,
  #app.show-minor .loc-label.type-island { display: block; }

  .panel {
    position: fixed;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--panel-fg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    z-index: 20;
  }

  #legend { top: 12px; left: 12px; max-width: 46vw; }
  #legend .title { font-weight: 700; margin-bottom: 4px; color: var(--accent); font-size: 12px; letter-spacing: 0.05em; }
  #legend .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,0.4); }

  #hud { top: 12px; right: 12px; font-size: 12px; color: var(--panel-fg-dim); text-align: right; }
  #hud b { color: var(--panel-fg); }

  #searchPanel {
    left: 12px; bottom: 12px;
    width: 260px;
    max-width: calc(100vw - 24px);
    padding: 8px;
  }
  #searchInput {
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: rgba(0,0,0,0.35);
    color: var(--panel-fg);
    font-size: 14px;
    outline: none;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchResults { margin-top: 6px; max-height: 40vh; overflow-y: auto; }
  #searchResults .item {
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  #searchResults .item:hover { background: rgba(255,255,255,0.10); }
  #searchResults .item .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #searchResults .item .t { font-size: 11px; color: var(--panel-fg-dim); flex: none; }
  #searchResults .empty { color: var(--panel-fg-dim); font-size: 12px; padding: 4px 6px; }

  #zoomControls {
    right: 12px; bottom: 12px;
    padding: 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoomControls button {
    width: 38px; height: 38px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.06);
    color: var(--panel-fg);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  #zoomControls button:active { background: rgba(255,255,255,0.18); }

  /* ---- Three.js "dive into the city" canvas, sits on top of the flat 2D map ----
     opacity/pointer-events are driven entirely from JS (city3d-viewer.js): transparent
     and click-through while zoomed out, fades in while diving, and only captures mouse/
     wheel input (for OrbitControls) once the dive-in has fully arrived. */
  #city3dCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }

  @media (max-width: 480px) {
    #legend { max-width: 60vw; font-size: 11px; padding: 8px 9px; }
    #legend .dot { width: 8px; height: 8px; }
    #hud { display: none; }
    #searchPanel { width: calc(100vw - 24px); }
    #zoomControls button { width: 34px; height: 34px; font-size: 17px; }
  }
</style>
</head>
<body>
<div id="app">
  <svg id="svgRoot" viewBox="0 0 154.56 100" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="154.56" height="100" fill="none"></rect>
    <g id="viewport">
      <g id="points"></g>
    </g>
  </svg>

  <div id="legend" class="panel">
    <div class="title">图例 LEGEND</div>
    <div id="legendRows"></div>
  </div>

  <div id="hud" class="panel">
    地点总数 <b id="countDisplay">0</b><br>
    拖拽平移 · 滚轮缩放 · 放大靠近城镇查看 3D<br>
    进入 3D 后：拖拽绕行 · 滚轮拉远退出
  </div>

  <div id="searchPanel" class="panel">
    <input id="searchInput" type="text" placeholder="搜索地名... / search place" autocomplete="off">
    <div id="searchResults"></div>
  </div>

  <div id="zoomControls" class="panel">
    <button id="zoomInBtn" title="放大">+</button>
    <button id="zoomOutBtn" title="缩小">&minus;</button>
  </div>

  <canvas id="city3dCanvas"></canvas>
</div>

<!-- Three.js r160, pinned, via CDN — an import map lets the ES modules below use
     clean bare specifiers ("three", "three/addons/...") the same way they would
     with a bundler, without needing to fetch/vendor anything locally. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
