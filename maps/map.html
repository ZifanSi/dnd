// 原图宽高比 8000:5176 -> viewBox 154.56 : 100
const VB_W = 154.56;
const VB_H = 100;

const TYPE_COLORS = {
  city: "red",
  town: "orange",
  forest: "green",
  mountain: "gray",
  river: "blue",
  region: "purple",
  island: "cyan"
};
const TYPE_LABELS_ZH = {
  city: "城市 city",
  town: "城镇 town",
  forest: "森林 forest",
  mountain: "山脉 mountain",
  river: "河流 river",
  region: "地区 region",
  island: "岛屿 island"
};

const SVGNS = "http://www.w3.org/2000/svg";
const pointsGroup = document.getElementById("points");

locations.forEach(loc => {
  const svgX = (loc.x / 100) * VB_W;
  const svgY = (loc.y / 100) * VB_H;
  const color = TYPE_COLORS[loc.type] || "black";
  const isCity = loc.type === "city";
  const r = isCity ? 0.65 : 0.4;
  const fontSize = isCity ? 1.9 : 1.3;

  const circle = document.createElementNS(SVGNS, "circle");
  circle.setAttribute("cx", svgX.toFixed(4));
  circle.setAttribute("cy", svgY.toFixed(4));
  circle.setAttribute("r", r);
  circle.setAttribute("fill", color);
  circle.setAttribute("stroke", "#1a1a1a");
  circle.setAttribute("stroke-width", isCity ? 0.15 : 0.1);
  pointsGroup.appendChild(circle);

  const text = document.createElementNS(SVGNS, "text");
  text.setAttribute("x", (svgX + r + 0.3).toFixed(4));
  text.setAttribute("y", (svgY + fontSize * 0.35).toFixed(4));
  text.setAttribute("font-size", fontSize);
  text.setAttribute("class", "loc-label");
  if (isCity) text.setAttribute("font-weight", "bold");
  text.textContent = loc.name;
  pointsGroup.appendChild(text);
});

document.getElementById("countDisplay").textContent = locations.length;

// legend
const legendEl = document.getElementById("legend");
Object.keys(TYPE_COLORS).forEach(t => {
  const row = document.createElement("div");
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.style.background = TYPE_COLORS[t];
  row.appendChild(dot);
  row.appendChild(document.createTextNode(TYPE_LABELS_ZH[t]));
  legendEl.appendChild(row);
});

// ---- pan & zoom ----
const svgRoot = document.getElementById("svgRoot");
const viewport = document.getElementById("viewport");

let panX = 0, panY = 0, scale = 1;
let isDragging = false;
let lastClientX = 0, lastClientY = 0;

function applyTransform() {
  viewport.setAttribute("transform", `translate(${panX},${panY}) scale(${scale})`);
}

function clientToSvgPoint(clientX, clientY) {
  const rect = svgRoot.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  return { x: relX * VB_W, y: relY * VB_H };
}

svgRoot.addEventListener("mousedown", e => {
  isDragging = true;
  svgRoot.classList.add("dragging");
  lastClientX = e.clientX;
  lastClientY = e.clientY;
});

window.addEventListener("mousemove", e => {
  if (!isDragging) return;
  const rect = svgRoot.getBoundingClientRect();
  const dxClient = e.clientX - lastClientX;
  const dyClient = e.clientY - lastClientY;
  // convert client-pixel delta to viewBox-unit delta
  const dx = dxClient * (VB_W / rect.width);
  const dy = dyClient * (VB_H / rect.height);
  panX += dx;
  panY += dy;
  lastClientX = e.clientX;
  lastClientY = e.clientY;
  applyTransform();
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  svgRoot.classList.remove("dragging");
});

svgRoot.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const mouse = clientToSvgPoint(e.clientX, e.clientY);
  // point under cursor in viewport-local (pre-transform) coordinates
  const localX = (mouse.x - panX) / scale;
  const localY = (mouse.y - panY) / scale;
  const newScale = Math.min(Math.max(scale * zoomFactor, 0.5), 60);
  panX = mouse.x - localX * newScale;
  panY = mouse.y - localY * newScale;
  scale = newScale;
  applyTransform();
}, { passive: false });

applyTransform();
</script>
</body>
</html>
